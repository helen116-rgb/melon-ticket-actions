name: Melon Ticket Action
on:
  workflow_dispatch:
  schedule:
    - cron: '*/0.25 * * * *'

jobs:
  run-ticket:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Install dependencies
        run: npm install
      - name: Build project
        run: ./node_modules/.bin/tsc

      - name: Run Script
        run: node dist/index.js
        env:
          INPUT_COOKIE: ${{ secrets.MELON_COOKIE }}
          INPUT_PRODUCT_ID: ${{ secrets.MELON_PRODUCT_ID }}
          INPUT_SCHEDULE_ID: ${{ secrets.MELON_SCHEDULE_ID }}
          INPUT_SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
